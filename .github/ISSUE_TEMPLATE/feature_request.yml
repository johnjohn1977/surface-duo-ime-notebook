name: 功能建議 / Feature request
description: 建議 Duo Deck 的鍵盤、中文輸入或觸控板改進
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題 / Problem
      description: 請先描述目前哪個操作不順，而不只是指定解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議方案 / Proposed behavior
      description: 描述希望的操作方式、按鍵配置或狀態切換。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 若有測過其他做法，請說明結果與取捨。

  - type: dropdown
    id: priority_mode
    attributes:
      label: 主要使用模式
      options:
        - Notebook mode
        - Full-screen IME mode
        - Book mode
        - All modes
    validations:
      required: true
